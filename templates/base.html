<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学习笔记{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <!-- Code highlighting -->
    <link rel="stylesheet" href="{{ root }}static/css/code.css">
    <!-- Design tokens (forest palette) -->
    <link rel="stylesheet" href="{{ root }}static/css/tokens.css">
    <!-- Custom -->
    <link rel="stylesheet" href="{{ root }}static/css/style.css">
    <!-- Forest ambient layer -->
    <link rel="stylesheet" href="{{ root }}static/css/forest_motion.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Ambient background -->
    <div class="ambient-bg">
        <div class="ambient-orb ambient-orb-1"></div>
        <div class="ambient-orb ambient-orb-2"></div>
        <div class="ambient-orb ambient-orb-3"></div>
    </div>
    <!-- Forest creature layer (fireflies, leaves, pollen) -->
    <div id="forest-layer" aria-hidden="true"></div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ root }}">
                <div class="brand-icon">
                    <i class="bi bi-flower2"></i>
                </div>
                <div class="brand-text">
                    <span class="brand-name">StudyNotes</span>
                    <span class="brand-sub">Knowledge Garden</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ root }}">
                            <i class="bi bi-house-heart"></i> 首页
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-brand">
                    <i class="bi bi-flower2"></i>
                    <span>StudyNotes</span>
                </div>
                <p>Let knowledge grow naturally. <i class="bi bi-tree" style="color: var(--green-400); font-size: 0.82rem;"></i></p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="{{ root }}static/js/main.js"></script>
    <script src="{{ root }}static/js/forest_motion.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
